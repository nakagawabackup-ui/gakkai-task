<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学会タスク・スケジュール管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; }
        .tab-active { border-bottom: 4px solid #0f172a; color: #0f172a; font-weight: 900; }
        .tab-inactive { border-bottom: 4px solid transparent; color: #64748b; font-weight: 500; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-l-8 border-indigo-600 pl-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 flex flex-wrap items-center gap-3">
                    学会発表スケジュール管理
                    <span id="sync-status"></span>
                </h1>
                <p class="text-slate-500 mt-2 font-medium">複数の学会発表に向けた準備タスクと〆切を横断的に管理します。</p>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div id="auth-container" class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-sm flex items-center gap-3">
                    <span id="user-info" class="text-slate-600 font-bold">起動中...</span>
                    <button id="login-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-700 transition shadow hidden">Googleでログイン</button>
                    <button id="logout-btn" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded text-xs font-bold hover:bg-slate-200 transition border border-slate-200 hidden">ログアウト</button>
                </div>
                <div id="overview-stats" class="text-right text-sm text-slate-600 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 hidden md:block">
                    <!-- 統計情報 -->
                </div>
            </div>
        </header>

        <div id="error-display" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-bold whitespace-pre-wrap"></div>

        <!-- 学会追加フォーム -->
        <div class="bg-white border border-slate-200 p-6 rounded-2xl mb-8 shadow-sm">
            <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="text-indigo-600">➕</span> 新しい学会の予定を追加
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div class="lg:col-span-1">
                    <label class="block text-xs font-bold text-slate-500 mb-1">学会・大会名 <span class="text-red-500">*</span></label>
                    <input type="text" id="simName" placeholder="例: 日本語教育学会" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="lg:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1">発表タイトル</label>
                    <input type="text" id="simTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">発表形式</label>
                    <select id="simFormat" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="">未定 / 選択なし</option>
                        <option value="口頭">口頭発表</option>
                        <option value="ポスター">ポスター発表</option>
                        <option value="パネル">パネルセッション</option>
                        <option value="デモ">デモンストレーション</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">公式サイトURL</label>
                    <input type="url" id="simUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">開催地</label>
                    <input type="text" id="simLocation" placeholder="オンライン, 東京など" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex gap-2 lg:col-span-2">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">開始日 <span class="text-red-500">*</span></label>
                        <input type="date" id="simStartDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">終了日</label>
                        <input type="date" id="simEndDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none">
                    </div>
                </div>
            </div>
            <div class="flex justify-end mt-2">
                <button onclick="importProject()" class="w-full md:w-auto bg-slate-900 text-white font-bold px-8 py-2.5 rounded shadow hover:bg-slate-800 transition">
                    スケジュール作成
                </button>
            </div>
        </div>

        <!-- タブ表示エリア -->
        <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-4 text-center tab-active hover:bg-slate-100 transition text-sm">
                    ⏱️ 全タスク 総合タイムライン
                </button>
                <button onclick="switchTab('project')" id="tab-project" class="flex-1 py-4 text-center tab-inactive hover:bg-slate-100 transition text-sm">
                    📁 学会別に管理・編集
                </button>
            </div>

            <div id="content-area" class="p-6 bg-slate-50 min-h-[500px]">
                <div class="text-center py-20 text-slate-400 font-bold">データを読み込み中...</div>
            </div>
        </div>
        <div class="mt-4 text-center text-slate-400 text-[10px]">
            ※チェックを入れた（完了した）タスクは、翌日になると自動的にリストから消去されます。
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const myFirebaseConfig = {
            apiKey: "AIzaSyC7mMddmukCPXkPX7Z2MD5fTcCFmUXnKGw",
            authDomain: "gakkai-task-manager.firebaseapp.com",
            projectId: "gakkai-task-manager",
            storageBucket: "gakkai-task-manager.firebasestorage.app",
            messagingSenderId: "841054331141",
            appId: "1:841054331141:web:c9c72af9178b919414976c"
        };

        window.projects = [];
        window.currentTab = 'timeline';

        const TASK_TEMPLATES = [
            { type: 'join', name: '入会手続き', offsetDays: -120 },
            { type: 'annual_fee', name: '年会費支払い', offsetDays: -120 },
            { type: 'apply', name: '発表申し込み', offsetDays: -90 },
            { type: 'abstract', name: '発表要旨の作成', offsetDays: -60 },
            { type: 'register', name: '参加申し込み', offsetDays: -60 },
            { type: 'flight', name: '航空券購入', offsetDays: -60 },
            { type: 'hotel', name: 'ホテル予約', offsetDays: -60 },
            { type: 'paper', name: '発表予稿の作成', offsetDays: -30 },
            { type: 'slide', name: 'ポスター・スライドの作成', offsetDays: -21 },
            { type: 'poster_order', name: 'ポスターの発注', offsetDays: -14 }
        ];

        let app, auth, db, provider;
        let currentUser = null;
        const APP_ID = 'gakkai_app'; 

        const showError = (msg) => {
            const el = document.getElementById('error-display');
            if (el) {
                el.textContent = msg;
                el.classList.remove('hidden');
                setTimeout(() => el.classList.add('hidden'), 10000);
            }
        };

        // --- Auth Setup ---
        try {
            app = initializeApp(myFirebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();

            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            const syncStatus = document.getElementById('sync-status');

            loginBtn.onclick = async () => {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    showError("ログイン失敗: " + error.message);
                }
            };

            logoutBtn.onclick = async () => {
                await signOut(auth);
                window.projects = []; 
                window.render();
            };

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    userInfo.innerHTML = `👤 <span class="font-bold text-indigo-700">${user.displayName}</span> さん`;
                    loginBtn.classList.add('hidden');
                    logoutBtn.classList.remove('hidden');
                    syncStatus.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-emerald-700 text-[11px] font-bold rounded-full border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> デバイス同期中</span>`;
                    setupFirestoreListener();
                } else {
                    userInfo.innerHTML = `未ログイン`;
                    loginBtn.classList.remove('hidden');
                    logoutBtn.classList.add('hidden');
                    syncStatus.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-amber-50 text-amber-700 text-[11px] font-bold rounded-full border border-amber-200"><span class="w-2 h-2 rounded-full bg-amber-500"></span> 同期オフ</span>`;
                    fallbackInit();
                }
            });
        } catch (e) {
            fallbackInit();
        }

        // --- Data Handling ---
        function fallbackInit() {
            const savedData = localStorage.getItem('gakkai_projects_v1');
            if (savedData) {
                let localProjects = JSON.parse(savedData);
                if (autoCleanupOldTasks(localProjects)) {
                    localStorage.setItem('gakkai_projects_v1', JSON.stringify(localProjects));
                }
                window.projects = localProjects;
            }
            window.render();
        }

        function autoCleanupOldTasks(projectsList) {
            const todayStr = new Date().toISOString().split('T')[0];
            let hasChanged = false;
            projectsList.forEach(proj => {
                proj.tasks = proj.tasks.filter(t => {
                    if (t.completed && t.completedAt && t.completedAt < todayStr) {
                        hasChanged = true;
                        return false;
                    }
                    return true;
                });
            });
            return hasChanged;
        }

        function setupFirestoreListener() {
            if (!currentUser) return;
            const projectsRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects');
            onSnapshot(projectsRef, (snapshot) => {
                let syncedProjects = [];
                snapshot.forEach(doc => syncedProjects.push({ id: doc.id, ...doc.data() }));
                if (autoCleanupOldTasks(syncedProjects)) {
                    syncedProjects.forEach(async (p) => await saveProject(p));
                }
                window.projects = syncedProjects;
                window.render();
            });
        }

        async function saveProject(proj) {
            if (currentUser) {
                const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', proj.id);
                await setDoc(docRef, proj);
            } else {
                const idx = window.projects.findIndex(p => p.id === proj.id);
                if (idx >= 0) window.projects[idx] = proj;
                else window.projects.push(proj);
                localStorage.setItem('gakkai_projects_v1', JSON.stringify(window.projects));
                window.render();
            }
        }

        async function removeProject(projectId) {
            if (currentUser) {
                const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', projectId);
                await deleteDoc(docRef);
            } else {
                window.projects = window.projects.filter(p => p.id !== projectId);
                localStorage.setItem('gakkai_projects_v1', JSON.stringify(window.projects));
                window.render();
            }
        }

        // --- UI Logic ---
        window.importProject = async function() {
            const name = document.getElementById('simName').value;
            const startDate = document.getElementById('simStartDate').value;
            if (!name || !startDate) return alert('学会名と開始日は入力必須です。');

            const confDate = new Date(startDate);
            const tasks = TASK_TEMPLATES.map(template => {
                const dueDate = new Date(confDate);
                dueDate.setDate(dueDate.getDate() + template.offsetDays);
                return {
                    id: 'task_' + Math.random().toString(36).substr(2, 9),
                    name: template.name,
                    dueDate: dueDate.toISOString().split('T')[0],
                    completed: false,
                    isCustom: false
                };
            });

            const newProject = {
                id: 'proj_' + Math.random().toString(36).substr(2, 9),
                name,
                presentationTitle: document.getElementById('simTitle').value || '',
                presentationFormat: document.getElementById('simFormat').value || '',
                url: document.getElementById('simUrl').value || '',
                location: document.getElementById('simLocation').value || '未設定',
                startDate,
                endDate: document.getElementById('simEndDate').value || startDate,
                tasks,
                isExpanded: true
            };
            
            ['simName', 'simTitle', 'simFormat', 'simUrl', 'simLocation', 'simStartDate', 'simEndDate'].forEach(id => document.getElementById(id).value = '');
            await saveProject(newProject);
        }

        window.addCustomTask = async function(projectId) {
            const name = document.getElementById(`customTaskName_${projectId}`).value;
            const date = document.getElementById(`customTaskDate_${projectId}`).value;
            if (!name || !date) return;
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                proj.tasks.push({ id: 'task_' + Math.random().toString(36).substr(2, 9), name, dueDate: date, completed: false, isCustom: true });
                proj.tasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
                await saveProject(proj);
            }
        }

        window.toggleTask = async function(projectId, taskId) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    task.completedAt = task.completed ? new Date().toISOString().split('T')[0] : null;
                    await saveProject(proj);
                }
            }
        }

        window.deleteTask = async function(projectId, taskId) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                proj.tasks = proj.tasks.filter(t => t.id !== taskId);
                await saveProject(proj);
            }
        }

        window.updateDate = async function(projectId, taskId, newDate) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) {
                    task.dueDate = newDate;
                    proj.tasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
                    await saveProject(proj);
                }
            }
        }

        window.toggleProjectExpand = async function(id) {
            const p = window.projects.find(x => x.id === id);
            if(p){ p.isExpanded = !p.isExpanded; await saveProject(p); }
        }

        window.deleteProject = async function(id) {
            if(confirm("この学会を削除しますか？")) await removeProject(id);
        }

        window.startEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = true; window.render(); }};
        window.cancelEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = false; window.render(); }};
        window.saveEdit = async (id) => {
            const p = window.projects.find(x => x.id === id);
            if(p){
                p.name = document.getElementById(`editName_${id}`).value;
                p.presentationTitle = document.getElementById(`editTitle_${id}`).value;
                p.presentationFormat = document.getElementById(`editFormat_${id}`).value;
                p.url = document.getElementById(`editUrl_${id}`).value;
                p.location = document.getElementById(`editLocation_${id}`).value;
                p.startDate = document.getElementById(`editStartDate_${id}`).value;
                p.endDate = document.getElementById(`editEndDate_${id}`).value || p.startDate;
                p.isEditing = false;
                await saveProject(p);
            }
        };

        window.switchTab = (tabId) => {
            window.currentTab = tabId;
            const tlTab = document.getElementById('tab-timeline');
            const pjTab = document.getElementById('tab-project');
            if (tlTab && pjTab) {
                tlTab.className = `flex-1 py-4 text-center ${tabId === 'timeline' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;
                pjTab.className = `flex-1 py-4 text-center ${tabId === 'project' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;
            }
            window.render();
        }

        window.getGoogleCalendarUrl = (tName, dStr, cName, pTitle) => {
            if (!dStr) return '#';
            const d = new Date(dStr); const d2 = new Date(d); d2.setDate(d2.getDate() + 1);
            const f = (dt) => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
            const details = encodeURIComponent(`学会タスク。${pTitle ? '\n発表: ' + pTitle : ''}`);
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`[${cName}] ${tName}`)}&dates=${f(d)}/${f(d2)}&details=${details}`;
        }

        window.getFormatBadge = (format) => {
            if(!format) return '';
            const colors = {
                '口頭': 'bg-blue-50 text-blue-600 border-blue-200',
                'ポスター': 'bg-emerald-50 text-emerald-600 border-emerald-200',
                'パネル': 'bg-purple-50 text-purple-600 border-purple-200',
                'デモ': 'bg-amber-50 text-amber-600 border-amber-200',
                'その他': 'bg-slate-50 text-slate-600 border-slate-200'
            };
            return `<span class="inline-block px-1.5 py-0.5 rounded border text-[9px] font-bold ${colors[format] || colors['その他']} ml-1">${format}</span>`;
        }

        // --- View Rendering ---
        window.render = () => {
            const container = document.getElementById('content-area');
            const statsEl = document.getElementById('overview-stats');
            if (!container) return;
            
            if (window.projects.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400">プロジェクトがありません</div>`;
                if (statsEl) statsEl.classList.add('hidden');
                return;
            }
            
            if (statsEl) {
                statsEl.classList.remove('hidden');
                let t = 0, d = 0; window.projects.forEach(p => { t += p.tasks.length; d += p.tasks.filter(x => x.completed).length; });
                statsEl.innerHTML = `プロジェクト: ${window.projects.length} 件 | 達成率: ${Math.round((d/t)*100)||0}%`;
            }
            
            if (window.currentTab === 'project') renderProjectView(container);
            else renderTimelineView(container);
        }

        const renderProjectView = (container) => {
            let html = '<div class="space-y-4">';
            window.projects.forEach(proj => {
                const done = proj.tasks.filter(t => t.completed).length;
                const progress = Math.round((done / proj.tasks.length) * 100) || 0;
                html += `
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    ${proj.isEditing ? `
                    <div class="p-4 bg-indigo-50 grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                        <div class="md:col-span-1">学会名: <input id="editName_${proj.id}" value="${proj.name}" class="w-full border p-2 rounded"></div>
                        <div class="md:col-span-2">発表タイトル: <input id="editTitle_${proj.id}" value="${proj.presentationTitle}" class="w-full border p-2 rounded"></div>
                        <div>形式: 
                            <select id="editFormat_${proj.id}" class="w-full border p-2 rounded">
                                <option value="" ${proj.presentationFormat === '' ? 'selected' : ''}>未定</option>
                                <option value="口頭" ${proj.presentationFormat === '口頭' ? 'selected' : ''}>口頭</option>
                                <option value="ポスター" ${proj.presentationFormat === 'ポスター' ? 'selected' : ''}>ポスター</option>
                                <option value="パネル" ${proj.presentationFormat === 'パネル' ? 'selected' : ''}>パネル</option>
                                <option value="デモ" ${proj.presentationFormat === 'デモ' ? 'selected' : ''}>デモ</option>
                                <option value="その他" ${proj.presentationFormat === 'その他' ? 'selected' : ''}>その他</option>
                            </select>
                        </div>
                        <div>開始: <input type="date" id="editStartDate_${proj.id}" value="${proj.startDate}" class="w-full border p-2 rounded"></div>
                        <div>終了: <input type="date" id="editEndDate_${proj.id}" value="${proj.endDate}" class="w-full border p-2 rounded"></div>
                        <div>開催地: <input type="text" id="editLocation_${proj.id}" value="${proj.location}" class="w-full border p-2 rounded"></div>
                        <div>URL: <input type="url" id="editUrl_${proj.id}" value="${proj.url}" class="w-full border p-2 rounded"></div>
                        <div class="flex items-end gap-2"><button onclick="saveEdit('${proj.id}')" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold">保存</button><button onclick="cancelEdit('${proj.id}')" class="border px-4 py-2 rounded bg-white">戻る</button></div>
                    </div>` : `
                    <div class="p-4 flex flex-col md:flex-row justify-between items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleProjectExpand('${proj.id}')">
                        <div class="flex items-center gap-3">
                            <span class="text-slate-400 text-sm">${proj.isExpanded ? '▼' : '▶'}</span>
                            <div>
                                <h3 class="font-black text-slate-800 flex items-center gap-1">${proj.name} ${window.getFormatBadge(proj.presentationFormat)}</h3>
                                <div class="text-[10px] text-slate-500 font-medium">日程: ${proj.startDate}〜${proj.endDate} | ${proj.presentationTitle || '発表未定'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-5 mt-3 md:mt-0">
                            <div class="w-24 bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="bg-indigo-600 h-full" style="width:${progress}%"></div></div>
                            <span class="text-xs font-black text-slate-600 w-8 text-right">${progress}%</span>
                            <button onclick="event.stopPropagation(); startEdit('${proj.id}')" class="text-slate-400 hover:text-indigo-600">✏️</button>
                            <button onclick="event.stopPropagation(); deleteProject('${proj.id}')" class="text-slate-400 hover:text-red-600">🗑️</button>
                        </div>
                    </div>`}
                    <div class="${proj.isExpanded && !proj.isEditing ? 'block' : 'hidden'} border-t bg-slate-50">
                        <table class="w-full text-sm">
                            <tbody>
                                ${proj.tasks.map(t => `<tr class="${t.completed ? 'opacity-40' : ''} border-b border-slate-200 hover:bg-white transition">
                                    <td class="p-3 w-10 text-center"><input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${proj.id}', '${t.id}')" class="w-4 h-4 accent-indigo-600"></td>
                                    <td class="p-3 font-medium ${t.completed ? 'line-through text-slate-400' : ''}">${t.name}</td>
                                    <td class="p-3 w-32"><input type="date" value="${t.dueDate}" onchange="updateDate('${proj.id}', '${t.id}', this.value)" class="text-xs border rounded p-1 w-full bg-white"></td>
                                    <td class="p-3 w-20 text-right space-x-2">
                                        <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, proj.name, proj.presentationTitle)}" target="_blank" title="カレンダーに追加">📅</a>
                                        <button onclick="deleteTask('${proj.id}', '${t.id}')" class="text-red-400 hover:text-red-600">🗑️</button>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                        <div class="p-3 flex gap-2"><input id="customTaskName_${proj.id}" placeholder="カスタムタスクを追加..." class="flex-1 text-xs p-1.5 border rounded focus:outline-none"><input type="date" id="customTaskDate_${proj.id}" class="text-xs border rounded p-1.5 bg-white"><button onclick="addCustomTask('${proj.id}')" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded font-bold">追加</button></div>
                    </div>
                </div>`;
            });
            container.innerHTML = html + '</div>';
        }

        const renderTimelineView = (container) => {
            let all = []; window.projects.forEach(p => p.tasks.forEach(t => all.push({...t, pId: p.id, pName: p.name, pTitle: p.presentationTitle, pFormat: p.presentationFormat})));
            all.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
            container.innerHTML = `
            <div class="bg-white border rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-900 text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-3 w-10 text-center">完了</th>
                            <th class="p-3 w-32">期日</th>
                            <th class="p-3">学会 / タスク</th>
                            <th class="p-3 w-24 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y border-slate-100">
                        ${all.map(t => `
                        <tr class="${t.completed ? 'opacity-40 bg-slate-50' : 'hover:bg-slate-50'} transition">
                            <td class="p-3 text-center">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.pId}', '${t.id}')" class="w-4 h-4 accent-indigo-600">
                            </td>
                            <td class="p-3 font-black text-slate-700">${t.dueDate}</td>
                            <td class="p-3">
                                <div class="text-[10px] opacity-60 font-bold flex items-center gap-1">${t.pName} ${window.getFormatBadge(t.pFormat)}</div>
                                <div class="${t.completed ? 'line-through text-slate-400' : 'font-medium text-slate-800'}">${t.name}</div>
                            </td>
                            <td class="p-3 text-center space-x-2">
                                <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, t.pName, t.pTitle)}" target="_blank" title="カレンダーに追加">📅</a>
                                <button onclick="deleteTask('${t.pId}', '${t.id}')" class="text-red-400 hover:text-red-600">🗑️</button>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
        }
    </script>
</body>
</html>
