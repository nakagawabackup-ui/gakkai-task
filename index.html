<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学会タスク・スケジュール管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; }
        .tab-active { border-bottom: 4px solid #0f172a; color: #0f172a; font-weight: 900; }
        .tab-inactive { border-bottom: 4px solid transparent; color: #64748b; font-weight: 500; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-l-8 border-indigo-600 pl-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 flex flex-wrap items-center gap-3">
                    学会発表スケジュール管理
                    <span id="sync-status"></span>
                </h1>
                <p class="text-slate-500 mt-2 font-medium">複数の学会発表に向けた準備タスクと〆切を横断的に管理します。</p>
            </div>
            <div class="flex flex-col items-end gap-2">
                <div id="auth-container" class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 text-sm flex items-center gap-3">
                    <span id="user-info" class="text-slate-600 font-bold">起動中...</span>
                    <button id="login-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-700 transition shadow hidden">Googleでログイン</button>
                    <button id="logout-btn" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded text-xs font-bold hover:bg-slate-200 transition border border-slate-200 hidden">ログアウト</button>
                </div>
                <div id="overview-stats" class="text-right text-sm text-slate-600 font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 hidden md:block">
                    <!-- 統計情報 -->
                </div>
            </div>
        </header>

        <div id="error-display" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-bold whitespace-pre-wrap"></div>

        <!-- 学会追加フォーム（折りたたみ対応） -->
        <div class="bg-white border border-slate-200 p-4 md:p-6 rounded-2xl mb-8 shadow-sm">
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 cursor-pointer select-none" onclick="toggleAddForm()">
                <span class="text-indigo-600">➕</span> 新しい学会の予定を追加
                <span id="add-form-icon" class="text-slate-400 text-xs ml-auto">▼</span>
            </h2>
            <div id="add-project-form" class="hidden mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">学会・大会名 <span class="text-red-500">*</span></label>
                        <input type="text" id="simName" placeholder="例: 日本語教育学会 2026春季" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 mb-1">発表タイトル</label>
                        <input type="text" id="simTitle" placeholder="例: 〇〇に関する考察" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">発表形式</label>
                        <select id="simFormat" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="">未定 / 選択なし</option>
                            <option value="口頭">口頭発表</option>
                            <option value="ポスター">ポスター発表</option>
                            <option value="パネル">パネルセッション</option>
                            <option value="デモ">デモンストレーション</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">公式サイトURL</label>
                        <input type="url" id="simUrl" placeholder="https://..." class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">開催地</label>
                        <input type="text" id="simLocation" placeholder="オンライン, 東京など" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div class="flex gap-2 lg:col-span-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-slate-500 mb-1">開始日 <span class="text-red-500">*</span></label>
                            <input type="date" id="simStartDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-slate-500 mb-1">終了日</label>
                            <input type="date" id="simEndDate" class="w-full p-2.5 rounded border border-slate-300 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end mt-2">
                    <button onclick="importProject()" class="w-full md:w-auto bg-slate-900 text-white font-bold px-8 py-2.5 rounded shadow hover:bg-slate-800 transition whitespace-nowrap">
                        スケジュール作成
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="flex-1 py-4 text-center tab-active hover:bg-slate-100 transition text-sm">
                    ⏱️ 全タスク 総合タイムライン
                </button>
                <button onclick="switchTab('project')" id="tab-project" class="flex-1 py-4 text-center tab-inactive hover:bg-slate-100 transition text-sm">
                    📁 学会別に管理・編集
                </button>
            </div>

            <div id="content-area" class="p-6 bg-slate-50 min-h-[500px]">
                <div class="text-center py-20 text-slate-400 font-bold">データを読み込み中...</div>
            </div>
        </div>
        <div class="mt-4 text-center text-slate-400 text-[10px]">
            ※タスク名や期日を直接クリックして編集できます。<br>
            ※完了したタスクは翌日（日本時間）になると自動的に非表示になります。非表示になっても進捗率には反映され続けます。完全に削除する場合はゴミ箱アイコンを押してください。
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const myFirebaseConfig = {
            apiKey: "AIzaSyC7mMddmukCPXkPX7Z2MD5fTcCFmUXnKGw",
            authDomain: "gakkai-task-manager.firebaseapp.com",
            projectId: "gakkai-task-manager",
            storageBucket: "gakkai-task-manager.firebasestorage.app",
            messagingSenderId: "841054331141",
            appId: "1:841054331141:web:c9c72af9178b919414976c"
        };

        window.projects = [];
        window.currentTab = 'timeline';

        const TASK_TEMPLATES = [
            { type: 'join', name: '入会手続き', offsetDays: -120 },
            { type: 'annual_fee', name: '年会費支払い', offsetDays: -120 },
            { type: 'apply', name: '発表申し込み', offsetDays: -90 },
            { type: 'abstract', name: '発表要旨の作成', offsetDays: -60 },
            { type: 'register', name: '参加申し込み', offsetDays: -60 },
            { type: 'flight', name: '航空券購入', offsetDays: -60 },
            { type: 'hotel', name: 'ホテル予約', offsetDays: -60 },
            { type: 'trip_paperwork', name: '出張手続き', offsetDays: -30 },
            { type: 'paper', name: '発表予稿の作成', offsetDays: -30 },
            { type: 'slide', name: 'ポスター・スライドの作成', offsetDays: -21 },
            { type: 'poster_order', name: 'ポスターの発注', offsetDays: -14 }
        ];

        let app, auth, db, provider;
        let currentUser = null;
        const APP_ID = 'gakkai_app'; 

        // 日本時間(JST)の今日の日付文字列を取得
        function getJSTDateStr() {
            const d = new Date();
            d.setTime(d.getTime() + 9 * 60 * 60 * 1000);
            return d.toISOString().split('T')[0];
        }

        // 昨日以前に完了したタスクか判定
        function isOldTask(completedAt) {
            if (!completedAt) return true; 
            return completedAt < getJSTDateStr();
        }

        const showError = (msg) => {
            const el = document.getElementById('error-display');
            if (el) {
                el.textContent = msg;
                el.classList.remove('hidden');
                setTimeout(() => el.classList.add('hidden'), 10000);
            }
        };

        try {
            app = initializeApp(myFirebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();

            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            const syncStatus = document.getElementById('sync-status');

            loginBtn.onclick = async () => {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    showError("ログインに失敗しました: " + error.message);
                }
            };

            logoutBtn.onclick = async () => {
                await signOut(auth);
                window.projects = []; 
                window.render();
            };

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    userInfo.innerHTML = `👤 <span class="font-bold text-indigo-700">${user.displayName || 'ユーザー'}</span> さん`;
                    loginBtn.classList.add('hidden');
                    logoutBtn.classList.remove('hidden');
                    syncStatus.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-emerald-700 text-[11px] font-bold rounded-full border border-emerald-200 shadow-sm"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> デバイス同期オン</span>`;
                    setupFirestoreListener();
                } else {
                    userInfo.innerHTML = `同期機能は未ログインです`;
                    loginBtn.classList.remove('hidden');
                    logoutBtn.classList.add('hidden');
                    syncStatus.innerHTML = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-amber-50 text-amber-700 text-[11px] font-bold rounded-full border border-amber-200 shadow-sm"><span class="w-2 h-2 rounded-full bg-amber-500"></span> ログイン待機中</span>`;
                    fallbackInit();
                }
            });
        } catch (e) {
            fallbackInit();
        }

        function fallbackInit() {
            const savedData = localStorage.getItem('gakkai_projects_v1');
            if (savedData) {
                try {
                    window.projects = JSON.parse(savedData);
                } catch(e) { window.projects = []; }
            }
            window.render();
        }

        function setupFirestoreListener() {
            if (!currentUser) return;
            const projectsRef = collection(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects');
            onSnapshot(projectsRef, (snapshot) => {
                let syncedProjects = [];
                snapshot.forEach(doc => {
                    syncedProjects.push({ id: doc.id, ...doc.data() });
                });
                window.projects = syncedProjects;
                window.render();
            }, (error) => {
                showError("同期エラーが発生しました。");
            });
        }

        async function saveProject(proj) {
            try {
                // 保存時にも確実にゴミタスクをデータから除外する（進捗率は維持）
                // ただし今回は "表示上隠す" 方針なのでデータからは消さない
                if (currentUser) {
                    const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', proj.id);
                    await setDoc(docRef, proj);
                } else {
                    const idx = window.projects.findIndex(p => p.id === proj.id);
                    if (idx >= 0) window.projects[idx] = proj;
                    else window.projects.push(proj);
                    localStorage.setItem('gakkai_projects_v1', JSON.stringify(window.projects));
                }
            } catch(e) {
                showError("保存中にエラーが発生しました: " + e.message);
                console.error(e);
            }
            window.render();
        }

        window.removeProject = async function(projectId) {
            try {
                if (currentUser) {
                    const docRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'projects', projectId);
                    await deleteDoc(docRef);
                } else {
                    window.projects = window.projects.filter(p => p.id !== projectId);
                    localStorage.setItem('gakkai_projects_v1', JSON.stringify(window.projects));
                    window.render();
                }
            } catch(e) {
                showError("削除に失敗しました: " + e.message);
            }
        }

        // 折りたたみフォームの切り替え
        window.toggleAddForm = function() {
            const form = document.getElementById('add-project-form');
            const icon = document.getElementById('add-form-icon');
            if (form.classList.contains('hidden')) {
                form.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                form.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        // スケジュール作成ボタンの処理
        window.importProject = async function() {
            try {
                const name = document.getElementById('simName').value;
                const startDateStr = document.getElementById('simStartDate').value;
                if (!name || !startDateStr) {
                    alert('学会名と開始日を入力してください。');
                    return;
                }

                const confDate = new Date(startDateStr);
                const tasks = TASK_TEMPLATES.map(template => {
                    const dueDate = new Date(confDate);
                    dueDate.setDate(dueDate.getDate() + template.offsetDays);
                    return {
                        id: 'task_' + Math.random().toString(36).substr(2, 9),
                        name: template.name,
                        dueDate: dueDate.toISOString().split('T')[0],
                        completed: false,
                        isCustom: false
                    };
                });

                const newProject = {
                    id: 'proj_' + Math.random().toString(36).substr(2, 9),
                    name: name,
                    presentationTitle: document.getElementById('simTitle').value || '',
                    presentationFormat: document.getElementById('simFormat').value || '',
                    url: document.getElementById('simUrl').value || '',
                    location: document.getElementById('simLocation').value || '未設定',
                    startDate: startDateStr,
                    endDate: document.getElementById('simEndDate').value || startDateStr,
                    tasks: tasks,
                    isExpanded: true
                };
                
                // 通信を待たずに即座に画面へ反映させる（楽観的UI更新）
                window.projects.push(newProject);
                window.render();

                // フォームをクリアして閉じる
                ['simName', 'simTitle', 'simFormat', 'simUrl', 'simLocation', 'simStartDate', 'simEndDate'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                toggleAddForm();

                // バックグラウンドで保存
                await saveProject(newProject);

            } catch(e) {
                showError("スケジュールの作成中にエラーが発生しました: " + e.message);
                console.error(e);
            }
        }

        window.addCustomTask = async function(projectId) {
            const nameEl = document.getElementById(`customTaskName_${projectId}`);
            const dateEl = document.getElementById(`customTaskDate_${projectId}`);
            if (!nameEl || !dateEl || !nameEl.value || !dateEl.value) return alert('タスク名と期日を入力してください。');

            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                proj.tasks.push({ id: 'task_' + Math.random().toString(36).substr(2, 9), name: nameEl.value, dueDate: dateEl.value, completed: false, isCustom: true });
                proj.tasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
                nameEl.value = ''; dateEl.value = '';
                window.render();
                await saveProject(proj);
            }
        }

        window.toggleTask = async function(projectId, taskId) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    task.completedAt = task.completed ? getJSTDateStr() : null;
                    window.render();
                    await saveProject(proj);
                }
            }
        }

        window.deleteTask = async function(projectId, taskId) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                proj.tasks = proj.tasks.filter(t => t.id !== taskId);
                window.render();
                await saveProject(proj);
            }
        }

        window.updateDate = async function(projectId, taskId, newDate) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) {
                    task.dueDate = newDate;
                    proj.tasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
                    window.render();
                    await saveProject(proj);
                }
            }
        }

        // タスク名のインライン編集
        window.updateTaskName = async function(projectId, taskId, newName) {
            if (!newName.trim()) return; 
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task && task.name !== newName.trim()) {
                    task.name = newName.trim();
                    await saveProject(proj);
                }
            }
        }

        window.toggleProjectExpand = async function(projectId) {
            const proj = window.projects.find(p => p.id === projectId);
            if (proj) { 
                proj.isExpanded = !proj.isExpanded; 
                window.render();
                await saveProject(proj); 
            }
        }

        window.deleteProject = async function(projectId) {
            if(confirm("この学会を削除しますか？")) await window.removeProject(projectId);
        }

        window.startEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = true; window.render(); }};
        window.cancelEdit = (id) => { const p = window.projects.find(x => x.id === id); if(p){ p.isEditing = false; window.render(); }};
        window.saveEdit = async (id) => {
            const p = window.projects.find(x => x.id === id);
            if(p){
                p.name = document.getElementById(`editName_${id}`).value;
                p.presentationTitle = document.getElementById(`editTitle_${id}`).value;
                p.presentationFormat = document.getElementById(`editFormat_${id}`).value;
                p.url = document.getElementById(`editUrl_${id}`).value;
                p.location = document.getElementById(`editLocation_${id}`).value;
                p.startDate = document.getElementById(`editStartDate_${id}`).value;
                p.endDate = document.getElementById(`editEndDate_${id}`).value || p.startDate;
                p.isEditing = false;
                window.render();
                await saveProject(p);
            }
        };

        window.switchTab = function(tabId) {
            window.currentTab = tabId;
            document.getElementById('tab-timeline').className = `flex-1 py-4 text-center ${tabId === 'timeline' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;
            document.getElementById('tab-project').className = `flex-1 py-4 text-center ${tabId === 'project' ? 'tab-active' : 'tab-inactive'} hover:bg-slate-100 transition text-sm`;
            window.render();
        }

        window.getGoogleCalendarUrl = function(taskName, dateStr, confName, presentationTitle) {
            if (!dateStr) return '#';
            const d = new Date(dateStr);
            const d2 = new Date(d); d2.setDate(d2.getDate() + 1);
            const formatDate = (dt) => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
            const text = encodeURIComponent(`[${confName}] ${taskName}`);
            const details = encodeURIComponent(`学会タスク管理ツールより。${presentationTitle ? '\n発表タイトル: ' + presentationTitle : ''}`);
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${formatDate(d)}/${formatDate(d2)}&details=${details}`;
        }

        // バッジの表示生成関数
        window.getFormatBadge = (format) => {
            if(!format) return '';
            const colors = { '口頭': 'bg-blue-50 text-blue-600 border-blue-200', 'ポスター': 'bg-emerald-50 text-emerald-600 border-emerald-200', 'パネル': 'bg-purple-50 text-purple-600 border-purple-200', 'デモ': 'bg-amber-50 text-amber-600 border-amber-200', 'その他': 'bg-slate-50 text-slate-600 border-slate-200' };
            return `<span class="inline-block px-1.5 py-0.5 rounded border text-[9px] font-bold ${colors[format] || colors['その他']} ml-1">${format}</span>`;
        }

        window.render = function() {
            window.updateStats();
            const container = document.getElementById('content-area');
            if (window.projects.length === 0) {
                container.innerHTML = `<div class="text-center py-20"><div class="text-4xl mb-4">📭</div><h3 class="text-lg font-bold text-slate-600">プロジェクトがありません</h3><p class="text-xs text-slate-400 mt-2">上のフォームから学会の予定を追加してください</p></div>`;
                return;
            }
            if (window.currentTab === 'project') window.renderProjectView(container);
            else window.renderTimelineView(container);
        }

        window.updateStats = function() {
            const statsEl = document.getElementById('overview-stats');
            if (!statsEl) return;
            if (window.projects.length === 0) { statsEl.classList.add('hidden'); return; }
            statsEl.classList.remove('hidden');
            // 進捗率は「見えないタスク」も含めて全タスクを対象に計算
            let total = 0, done = 0;
            window.projects.forEach(p => { total += p.tasks.length; done += p.tasks.filter(t => t.completed).length; });
            statsEl.innerHTML = `進行中のプロジェクト: <span class="text-indigo-600">${window.projects.length}</span> 件 <span class="mx-2">|</span> 達成率: <span class="text-indigo-600">${Math.round((done/total)*100)||0}%</span>`;
        }

        window.renderProjectView = function(container) {
            const sortedProjects = [...window.projects].sort((a, b) => new Date(a.startDate || 0) - new Date(b.startDate || 0));
            let html = '<div class="space-y-4">';
            sortedProjects.forEach(proj => {
                const done = proj.tasks.filter(t => t.completed).length;
                const progress = Math.round((done / proj.tasks.length) * 100) || 0;
                const dateDisp = proj.startDate === proj.endDate ? proj.startDate : `${proj.startDate} 〜 ${proj.endDate}`;
                
                // 画面に描画する用のタスク配列（昨日以前に完了したタスクを除外して非表示にする）
                const visibleTasks = proj.tasks.filter(t => !(t.completed && isOldTask(t.completedAt)));

                // 学会名にリンクを付与
                const nameHtml = proj.url 
                    ? `<a href="${proj.url}" target="_blank" onclick="event.stopPropagation()" class="hover:text-indigo-600 hover:underline transition text-indigo-900" title="学会のウェブサイトを開く">${proj.name} <span class="text-xs">🔗</span></a>`
                    : proj.name;

                html += `
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    ${proj.isEditing ? `
                    <div class="p-4 bg-indigo-50 border-b border-slate-200">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-3 text-xs">
                            <div>学会名: <input type="text" id="editName_${proj.id}" value="${proj.name}" class="w-full p-2 border rounded"></div>
                            <div class="lg:col-span-2">発表タイトル: <input type="text" id="editTitle_${proj.id}" value="${proj.presentationTitle}" class="w-full p-2 border rounded"></div>
                            <div>形式: <select id="editFormat_${proj.id}" class="w-full p-2 border rounded"><option value="" ${proj.presentationFormat === '' ? 'selected' : ''}>未定</option><option value="口頭" ${proj.presentationFormat === '口頭' ? 'selected' : ''}>口頭</option><option value="ポスター" ${proj.presentationFormat === 'ポスター' ? 'selected' : ''}>ポスター</option><option value="パネル" ${proj.presentationFormat === 'パネル' ? 'selected' : ''}>パネル</option><option value="デモ" ${proj.presentationFormat === 'デモ' ? 'selected' : ''}>デモ</option><option value="その他" ${proj.presentationFormat === 'その他' ? 'selected' : ''}>その他</option></select></div>
                            <div>URL: <input type="url" id="editUrl_${proj.id}" value="${proj.url}" class="w-full p-2 border rounded"></div>
                            <div>開催地: <input type="text" id="editLocation_${proj.id}" value="${proj.location}" class="w-full p-2 border rounded"></div>
                            <div class="flex gap-2">
                                <div>開始: <input type="date" id="editStartDate_${proj.id}" value="${proj.startDate}" class="w-full p-2 border rounded"></div>
                                <div>終了: <input type="date" id="editEndDate_${proj.id}" value="${proj.endDate}" class="w-full p-2 border rounded"></div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2"><button onclick="cancelEdit('${proj.id}')" class="px-3 py-1 bg-white border rounded">キャンセル</button><button onclick="saveEdit('${proj.id}')" class="px-3 py-1 bg-indigo-600 text-white rounded">保存</button></div>
                    </div>` : `
                    <div class="p-4 flex flex-col sm:flex-row justify-between items-center cursor-pointer hover:bg-slate-50" onclick="toggleProjectExpand('${proj.id}')">
                        <div class="flex items-center gap-3">
                            <div class="text-xl">${proj.isExpanded ? '🔽' : '▶️'}</div>
                            <div>
                                <h3 class="text-base font-black">${nameHtml} ${window.getFormatBadge(proj.presentationFormat)}</h3>
                                <div class="text-xs text-slate-500">日程: ${dateDisp} | ${proj.presentationTitle || '発表未定'} | ${done}/${proj.tasks.length}完了</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 mt-4 sm:mt-0">
                            <span class="text-xs font-bold">${progress}%</span>
                            <button onclick="event.stopPropagation(); startEdit('${proj.id}')">✏️</button>
                            <button onclick="event.stopPropagation(); deleteProject('${proj.id}')">🗑️</button>
                        </div>
                    </div>`}
                    <div class="${proj.isExpanded && !proj.isEditing ? 'block' : 'hidden'} border-t border-slate-100 bg-white">
                        <table class="w-full text-left text-sm">
                            <tbody class="divide-y divide-slate-100">
                                ${visibleTasks.map(task => {
                                    const isPast = !task.completed && new Date(task.dueDate) < new Date(new Date().setHours(0,0,0,0));
                                    return `<tr class="${task.completed ? 'opacity-40' : ''} hover:bg-slate-50">
                                        <td class="p-3 w-12 text-center"><input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${proj.id}', '${task.id}')"></td>
                                        <td class="p-3"><input type="text" value="${task.name}" onchange="updateTaskName('${proj.id}', '${task.id}', this.value)" class="w-full bg-transparent border border-transparent hover:border-slate-200 focus:border-indigo-500 focus:bg-white rounded px-2 py-1 outline-none text-sm ${task.completed ? 'line-through font-medium text-slate-400' : 'font-medium text-slate-800'}"></td>
                                        <td class="p-3 w-36"><input type="date" value="${task.dueDate}" class="text-xs border rounded p-1 w-full ${isPast ? 'text-red-500 font-bold border-red-200' : ''}" onchange="updateDate('${proj.id}', '${task.id}', this.value)"></td>
                                        <td class="p-3 w-24 text-right space-x-2">
                                            <a href="${window.getGoogleCalendarUrl(task.name, task.dueDate, proj.name, proj.presentationTitle)}" target="_blank">📅</a>
                                            <button onclick="deleteTask('${proj.id}', '${task.id}')">🗑️</button>
                                        </td>
                                    </tr>`}).join('')}
                            </tbody>
                        </table>
                        <div class="p-3 bg-slate-50 flex gap-2"><input type="text" id="customTaskName_${proj.id}" placeholder="タスク追加..." class="flex-1 text-xs border rounded p-1"><input type="date" id="customTaskDate_${proj.id}" class="text-xs border rounded p-1"><button onclick="addCustomTask('${proj.id}')" class="text-xs bg-indigo-600 text-white px-2 rounded">追加</button></div>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        window.renderTimelineView = function(container) {
            let all = []; 
            window.projects.forEach(p => {
                p.tasks.forEach(t => {
                    // 描画用のタスク（昨日以前に完了したタスクは表示しない）
                    if (!(t.completed && isOldTask(t.completedAt))) {
                        all.push({...t, projId: p.id, projName: p.name, projTitle: p.presentationTitle, pFormat: p.presentationFormat, pUrl: p.url});
                    }
                });
            });
            all.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

            container.innerHTML = `
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                <table class="w-full text-sm">
                    <thead class="bg-slate-900 text-white text-xs text-left">
                        <tr><th class="p-3 w-12 text-center">完了</th><th class="p-3 w-32">期日 ▲</th><th class="p-3">学会 / タスク</th><th class="p-3 w-20 text-center">操作</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${all.map(t => {
                            const isPast = !t.completed && new Date(t.dueDate) < new Date(new Date().setHours(0,0,0,0));
                            const nameHtml = t.pUrl 
                                ? `<a href="${t.pUrl}" target="_blank" onclick="event.stopPropagation()" class="hover:text-indigo-600 hover:underline transition" title="学会サイトを開く">${t.projName} <span class="text-[8px]">🔗</span></a>` 
                                : t.projName;

                            return `<tr class="${t.completed ? 'opacity-40 bg-slate-50' : ''} hover:bg-slate-50">
                                <td class="p-3 text-center"><input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.projId}', '${t.id}')"></td>
                                <td class="p-3"><input type="date" value="${t.dueDate}" class="text-xs border border-transparent hover:border-slate-200 focus:border-indigo-500 rounded p-1 w-full bg-transparent focus:bg-white outline-none ${isPast ? 'text-red-500 font-bold' : ''}" onchange="updateDate('${t.projId}', '${t.id}', this.value)"></td>
                                <td class="p-3">
                                    <div class="text-[10px] opacity-60 font-bold flex items-center gap-1">${nameHtml} ${window.getFormatBadge(t.pFormat)}</div>
                                    <input type="text" value="${t.name}" onchange="updateTaskName('${t.projId}', '${t.id}', this.value)" class="w-full mt-1 bg-transparent border border-transparent hover:border-slate-200 focus:border-indigo-500 focus:bg-white rounded px-1 outline-none text-sm ${t.completed ? 'line-through font-medium text-slate-400' : 'font-medium text-slate-800'}">
                                </td>
                                <td class="p-3 text-center space-x-2">
                                    <a href="${window.getGoogleCalendarUrl(t.name, t.dueDate, t.projName, t.projTitle)}" target="_blank">📅</a>
                                    <button onclick="deleteTask('${t.projId}', '${t.id}')">🗑️</button>
                                </td>
                            </tr>`}).join('')}
                    </tbody>
                </table>
            </div>`;
        }
    </script>
</body>
</html>
